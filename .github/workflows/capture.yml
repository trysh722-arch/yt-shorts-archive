name: youtube-shorts-capture

# 한국시간 08:00 / 20:00 (깃허브 크론은 UTC 기준)
on:
  schedule:
    - cron: '0 23 * * *'   # 23:00 UTC = 08:00 KST
    - cron: '0 11 * * *'   # 11:00 UTC = 20:00 KST
  workflow_dispatch:
    inputs:
      keyword:
        description: '이 키워드 하나만 (비우면 시트의 _키워드 탭 전부)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: youtube-shorts-capture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 다른 실행이 먼저 푸시했을 때 rebase할 공통 이력 확보

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: |
          pip install --quiet playwright pillow gspread
          playwright install --with-deps chromium

      - name: 오프라인 파싱 테스트
        run: python test_offline.py

      - name: 서비스계정 키 쓰기
        env:
          SA: ${{ secrets.GOOGLE_SA_JSON }}
        run: printf '%s' "$SA" > service_account.json

      - name: 캡처 → 이미지 커밋 → 시트 기록
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          KEYWORD: ${{ github.event.inputs.keyword }}
        run: |
          if [ -n "$KEYWORD" ]; then python run.py "$KEYWORD"; else python run.py; fi

      - name: 키 삭제
        if: always()
        run: rm -f service_account.json

      - name: 원본 캡처 보관 (분할본 포함, 30일 — 디버깅용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-${{ github.run_number }}
          path: out
          retention-days: 30
          if-no-files-found: ignore
